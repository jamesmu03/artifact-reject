<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Signal Monitor — Artifact Rejection Demo</title>
<meta name="description" content="Real-time artifact rejection for BCI neural signals. Compare MAD+FFT detector vs z-score baseline.">
<style>
:root {
    --bg-primary: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text-primary: #ecf0f1;
    --text-secondary: #7f8c8d;
    --green: #2ecc71;
    --red: #e74c3c;
    --orange: #e67e22;
    --blue: #3498db;
    --yellow: #f1c40f;
    --font-main: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ===== Status bar ===== */
#status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    padding: 0 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 5;
}

#status-bar .left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}

.title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-primary);
}

#status-bar .right {
    display: flex;
    align-items: center;
    gap: 14px;
}

.meta {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
}

.divider {
    color: var(--border);
    font-size: 12px;
}

/* Inline toggle switches */
.toggle-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    user-select: none;
}

.toggle-inline input { display: none; }

.toggle-track-sm {
    width: 32px;
    height: 16px;
    border-radius: 8px;
    background: var(--border);
    position: relative;
    transition: background 0.2s;
}

.toggle-track-sm::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
}

.toggle-inline input:checked + .toggle-track-sm {
    background: var(--green);
}

.toggle-inline input:checked + .toggle-track-sm::after {
    transform: translateX(16px);
}

/* ===== Traces ===== */
#traces {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 12px;
    padding-bottom: 48px; /* space for collapsed mouse bar */
    min-height: 0;
}

.trace-wrap {
    flex: 1;
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 0;
    transition: opacity 0.3s;
}

.trace-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.trace-label {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 11px;
    z-index: 1;
    pointer-events: none;
}

.trace-stats {
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    z-index: 1;
    pointer-events: none;
    color: var(--text-secondary);
}

/* ===== Mouse panel ===== */
#mouse-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-primary);
    border-top: 1px solid var(--border);
    transition: height 0.4s ease;
    overflow: hidden;
    z-index: 10;
}

#mouse-panel.collapsed {
    height: 40px;
}

#mouse-panel.expanded {
    height: calc(100vh - 44px - 33.33vh);
}

#mouse-toggle-bar {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 13px;
    transition: background 0.2s;
    user-select: none;
}

#mouse-toggle-bar:hover {
    background: var(--bg-card);
}

.key-hint {
    font-size: 11px;
    color: var(--border);
    font-family: var(--font-mono);
}

#mouse-content {
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(100% - 40px);
    padding: 16px 24px;
}

.mouse-panels-row {
    display: flex;
    gap: 24px;
    height: 100%;
    width: 100%;
    max-width: 1200px;
}

.mouse-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.mouse-card canvas {
    flex: 1;
    width: 100%;
    cursor: crosshair;
}

.mouse-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
}

.mouse-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 8px 14px;
    text-align: center;
    min-height: 32px;
    transition: opacity 0.3s;
}
</style>
</head>
<body>

<!-- Status Bar -->
<div id="status-bar">
    <div class="left">
        <div class="pulse-dot"></div>
        <span class="title">Neural Signal Monitor</span>
    </div>
    <div class="right">
        <span class="meta">32 CH</span>
        <span class="divider">|</span>
        <span class="meta">30 kHz</span>
        <span class="divider">|</span>
        <label class="toggle-inline">
            <span>Inject</span>
            <input type="checkbox" id="inject-toggle">
            <span class="toggle-track-sm"></span>
        </label>
        <label class="toggle-inline">
            <span>Highlight</span>
            <input type="checkbox" id="highlight-toggle" checked>
            <span class="toggle-track-sm"></span>
        </label>
    </div>
</div>

<!-- Three Signal Traces -->
<div id="traces">
    <div class="trace-wrap">
        <span class="trace-label" style="color:var(--text-secondary);">Raw broadband — ch 0</span>
        <canvas id="canvas-raw"></canvas>
    </div>
    <div class="trace-wrap" id="trace-ours">
        <span class="trace-label" style="color:var(--green);">Ours (MAD + FFT) — ch 0</span>
        <span class="trace-stats" id="stats-ours">P: —  R: —</span>
        <canvas id="canvas-ours"></canvas>
    </div>
    <div class="trace-wrap" id="trace-baseline">
        <span class="trace-label" style="color:var(--red);">Z-score baseline (5σ) — ch 0</span>
        <span class="trace-stats" id="stats-baseline">P: —  R: —</span>
        <canvas id="canvas-baseline"></canvas>
    </div>
</div>

<!-- Expandable Mouse Panel -->
<div id="mouse-panel" class="collapsed">
    <div id="mouse-toggle-bar" onclick="toggleMousePanel()">
        <span id="mouse-toggle-icon">▲</span>
        <span id="mouse-toggle-text">Show patient impact demo</span>
        <span class="key-hint">[p]</span>
    </div>
    <div id="mouse-content">
        <div class="mouse-panels-row">
            <div class="mouse-card">
                <div class="mouse-title" style="color:var(--red);">Without artifact rejection</div>
                <canvas id="mouse-left-canvas"></canvas>
                <div class="mouse-subtitle" id="mouse-left-sub">Move your mouse anywhere</div>
            </div>
            <div class="mouse-card">
                <div class="mouse-title" style="color:var(--green);">With artifact rejection</div>
                <canvas id="mouse-right-canvas"></canvas>
                <div class="mouse-subtitle" id="mouse-right-sub">Move your mouse anywhere</div>
            </div>
        </div>
    </div>
</div>

<script>
// ===== Data & State =====
let cleanData = [];
let artifactData = [];
let currentIndex = 0;
let injectEnabled = false;
let highlightEnabled = true;

// Buffers
const DISPLAY_POINTS = 1200;
const MAX_AMPLITUDE = 800;
let signalBuffer = [];
let oursCleanBuffer = [];
let baselineCleanBuffer = [];
let artifactTypeBuffer = [];
let oursHitBuffer = [];
let baselineHitBuffer = [];

// Smooth scrolling
let tickIntervalMs = 400;
let tickTimer = null;
let pendingPoints = [];
let pendingOursFlags = [];
let pendingBaseFlags = [];
let pendingTypeFlags = [];

// Stats
let stats = {
    total: 0,
    oursTP: 0, oursFP: 0, oursFN: 0,
    baseTP: 0, baseFP: 0, baseFN: 0,
    oursDetected: 0,
    baseDetected: 0,
};

// Mouse panel
let mousePanelExpanded = false;
let mouseX = 0, mouseY = 0;
let mouseActive = false;
let leftTrail = [];
let rightTrail = [];
const MAX_TRAIL = 300;

// Artifact highlight colors
const ARTIFACT_COLORS = {
    spike:    'rgba(231, 76, 60, 0.15)',
    '60hz':   'rgba(230, 126, 34, 0.15)',
    flatline: 'rgba(241, 196, 15, 0.15)',
};
const OURS_SHADE = 'rgba(46, 204, 113, 0.15)';
const BASE_SHADE = 'rgba(231, 76, 60, 0.15)';


// ===== Data Loading =====
async function loadData() {
    try {
        const [cleanRes, artifactRes] = await Promise.all([
            fetch('data_clean.json'),
            fetch('data_artifacts.json'),
        ]);
        cleanData = await cleanRes.json();
        artifactData = await artifactRes.json();
        console.log(`Loaded ${cleanData.length} clean + ${artifactData.length} artifact windows`);
        startPlayback();
    } catch (err) {
        console.error('Failed to load data:', err);
    }
}


// ===== Canvas Sizing =====
function resizeCanvases() {
    const canvases = ['canvas-raw', 'canvas-ours', 'canvas-baseline'];
    canvases.forEach(id => {
        const c = document.getElementById(id);
        if (!c) return;
        const rect = c.parentElement.getBoundingClientRect();
        c.width = rect.width * devicePixelRatio;
        c.height = rect.height * devicePixelRatio;
    });
    resizeMouseCanvases();
}

function resizeMouseCanvases() {
    ['mouse-left-canvas', 'mouse-right-canvas'].forEach(id => {
        const c = document.getElementById(id);
        if (!c) return;
        const rect = c.parentElement.getBoundingClientRect();
        c.width = rect.width * devicePixelRatio;
        c.height = rect.height * devicePixelRatio;
    });
}


// ===== Stats =====
function updateStatsFromWindow(win) {
    stats.total++;
    const gt = win.injected_type !== null;
    if (gt) {
        if (win.ours_hit) stats.oursTP++; else stats.oursFN++;
        if (win.baseline_hit) stats.baseTP++; else stats.baseFN++;
    } else {
        if (win.ours_hit) stats.oursFP++;
        if (win.baseline_hit) stats.baseFP++;
    }
    if (win.ours_hit) stats.oursDetected++;
    if (win.baseline_hit) stats.baseDetected++;
}

function updateStats() {
    const oursPrec = (stats.oursTP + stats.oursFP > 0)
        ? ((stats.oursTP / (stats.oursTP + stats.oursFP)) * 100).toFixed(0) + '%' : '—';
    const oursRec = (stats.oursTP + stats.oursFN > 0)
        ? ((stats.oursTP / (stats.oursTP + stats.oursFN)) * 100).toFixed(0) + '%' : '—';
    document.getElementById('stats-ours').textContent = `P: ${oursPrec}  R: ${oursRec}`;

    const basePrec = (stats.baseTP + stats.baseFP > 0)
        ? ((stats.baseTP / (stats.baseTP + stats.baseFP)) * 100).toFixed(0) + '%' : '—';
    const baseRec = (stats.baseTP + stats.baseFN > 0)
        ? ((stats.baseTP / (stats.baseTP + stats.baseFN)) * 100).toFixed(0) + '%' : '—';
    document.getElementById('stats-baseline').textContent = `P: ${basePrec}  R: ${baseRec}`;
}


// ===== Trace Rendering =====
function renderTrace(canvasId, buffer, flagBuffer, color, mode) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, w, h);

    if (buffer.length < 2) return;

    const yScale = h / (2 * MAX_AMPLITUDE);
    const yMid = h / 2;
    const n = buffer.length;

    // Draw artifact/detection shading
    if (highlightEnabled && flagBuffer.length === n) {
        let i = 0;
        while (i < n) {
            if (mode === 'raw') {
                // Shade by artifact type
                const t = flagBuffer[i];
                if (t !== null && ARTIFACT_COLORS[t]) {
                    const startX = (i / n) * w;
                    let j = i;
                    while (j < n && flagBuffer[j] === t) j++;
                    const endX = (j / n) * w;
                    ctx.fillStyle = ARTIFACT_COLORS[t];
                    ctx.fillRect(startX, 0, endX - startX, h);
                    i = j;
                    continue;
                }
            } else if (mode === 'ours') {
                if (flagBuffer[i] === true) {
                    const startX = (i / n) * w;
                    let j = i;
                    while (j < n && flagBuffer[j] === true) j++;
                    const endX = (j / n) * w;
                    ctx.fillStyle = OURS_SHADE;
                    ctx.fillRect(startX, 0, endX - startX, h);
                    i = j;
                    continue;
                }
            } else if (mode === 'baseline') {
                if (flagBuffer[i] === true) {
                    const startX = (i / n) * w;
                    let j = i;
                    while (j < n && flagBuffer[j] === true) j++;
                    const endX = (j / n) * w;
                    ctx.fillStyle = BASE_SHADE;
                    ctx.fillRect(startX, 0, endX - startX, h);
                    i = j;
                    continue;
                }
            }
            i++;
        }
    }

    // Draw the trace line
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = devicePixelRatio;
    for (let i = 0; i < n; i++) {
        const x = (i / n) * w;
        const y = yMid - buffer[i] * yScale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}


// ===== Playback =====
function tick() {
    const data = injectEnabled ? artifactData : cleanData;
    if (data.length === 0) return;
    const win = data[currentIndex % data.length];

    updateStatsFromWindow(win);

    // Queue points for smooth rendering
    pendingPoints.push(...win.signal_ch0);
    pendingOursFlags.push(...new Array(win.signal_ch0.length).fill(win.ours_hit));
    pendingBaseFlags.push(...new Array(win.signal_ch0.length).fill(win.baseline_hit));
    pendingTypeFlags.push(...new Array(win.signal_ch0.length).fill(win.injected_type));

    updateStats();
    currentIndex++;
}

function renderLoop() {
    // Drain a batch of pending points per frame
    const targetFrames = Math.max(1, Math.round(tickIntervalMs / 16));
    const batchSize = Math.max(1, Math.ceil(pendingPoints.length / targetFrames));

    if (pendingPoints.length > 0) {
        const batch = pendingPoints.splice(0, batchSize);
        const oursBatch = pendingOursFlags.splice(0, batchSize);
        const baseBatch = pendingBaseFlags.splice(0, batchSize);
        const typeBatch = pendingTypeFlags.splice(0, batchSize);

        signalBuffer.push(...batch);
        oursHitBuffer.push(...oursBatch);
        baselineHitBuffer.push(...baseBatch);
        artifactTypeBuffer.push(...typeBatch);

        // Build cleaned buffers
        const oursCleaned = batch.map((v, i) => oursBatch[i] ? 0 : v);
        const baseCleaned = batch.map((v, i) => baseBatch[i] ? 0 : v);
        oursCleanBuffer.push(...oursCleaned);
        baselineCleanBuffer.push(...baseCleaned);

        // Trim all buffers
        const max = DISPLAY_POINTS;
        if (signalBuffer.length > max) {
            signalBuffer = signalBuffer.slice(-max);
            oursHitBuffer = oursHitBuffer.slice(-max);
            baselineHitBuffer = baselineHitBuffer.slice(-max);
            artifactTypeBuffer = artifactTypeBuffer.slice(-max);
            oursCleanBuffer = oursCleanBuffer.slice(-max);
            baselineCleanBuffer = baselineCleanBuffer.slice(-max);
        }
    }

    // Render all visible traces
    renderTrace('canvas-raw', signalBuffer, artifactTypeBuffer, '#ecf0f1', 'raw');
    renderTrace('canvas-ours', oursCleanBuffer, oursHitBuffer, '#2ecc71', 'ours');
    renderTrace('canvas-baseline', baselineCleanBuffer, baselineHitBuffer, '#e67e22', 'baseline');

    // Render mouse panels if expanded
    updateMousePanels();

    requestAnimationFrame(renderLoop);
}

function startPlayback() {
    resizeCanvases();
    tickTimer = setInterval(tick, tickIntervalMs);
    requestAnimationFrame(renderLoop);
}

function resetPlayback() {
    currentIndex = 0;
    signalBuffer = [];
    oursCleanBuffer = [];
    baselineCleanBuffer = [];
    artifactTypeBuffer = [];
    oursHitBuffer = [];
    baselineHitBuffer = [];
    pendingPoints = [];
    pendingOursFlags = [];
    pendingBaseFlags = [];
    pendingTypeFlags = [];
    leftTrail = [];
    rightTrail = [];
    mouseActive = false;
    stats = { total: 0, oursTP: 0, oursFP: 0, oursFN: 0, baseTP: 0, baseFP: 0, baseFN: 0, oursDetected: 0, baseDetected: 0 };
    updateStats();
    // Reset mouse subtitles
    const leftSub = document.getElementById('mouse-left-sub');
    const rightSub = document.getElementById('mouse-right-sub');
    if (leftSub) { leftSub.textContent = 'Move your mouse anywhere'; leftSub.style.opacity = '1'; }
    if (rightSub) { rightSub.textContent = 'Move your mouse anywhere'; rightSub.style.opacity = '1'; }
}


// ===== Toggles =====
function onInjectToggle() {
    injectEnabled = document.getElementById('inject-toggle').checked;
    resetPlayback();
}

function onHighlightToggle() {
    highlightEnabled = document.getElementById('highlight-toggle').checked;
}

document.getElementById('inject-toggle').addEventListener('change', onInjectToggle);
document.getElementById('highlight-toggle').addEventListener('change', onHighlightToggle);


// ===== Mouse Panel =====
function toggleMousePanel() {
    mousePanelExpanded = !mousePanelExpanded;
    const panel = document.getElementById('mouse-panel');
    const icon = document.getElementById('mouse-toggle-icon');
    const text = document.getElementById('mouse-toggle-text');

    if (mousePanelExpanded) {
        panel.classList.replace('collapsed', 'expanded');
        icon.textContent = '▼';
        text.textContent = 'Hide patient impact demo';
        document.getElementById('trace-ours').style.display = 'none';
        document.getElementById('trace-baseline').style.display = 'none';
        setTimeout(resizeMouseCanvases, 400);
    } else {
        panel.classList.replace('expanded', 'collapsed');
        icon.textContent = '▲';
        text.textContent = 'Show patient impact demo';
        document.getElementById('trace-ours').style.display = '';
        document.getElementById('trace-baseline').style.display = '';
    }
}


// ===== Mouse Tracking =====
document.addEventListener('mousemove', (e) => {
    if (!mouseActive) {
        mouseActive = true;
        document.getElementById('mouse-left-sub').style.opacity = '0';
        document.getElementById('mouse-right-sub').style.opacity = '0';
        setTimeout(() => {
            const leftSub = document.getElementById('mouse-left-sub');
            const rightSub = document.getElementById('mouse-right-sub');
            leftSub.textContent = injectEnabled ? 'Artifacts disrupting decoder' : 'No artifacts — cursors identical';
            rightSub.textContent = injectEnabled ? 'Artifacts cleaned — cursor stable' : 'No artifacts — cursors identical';
            leftSub.style.opacity = '1';
            rightSub.style.opacity = '1';
        }, 300);
    }

    const nx = e.clientX / window.innerWidth;
    const ny = e.clientY / window.innerHeight;

    const canvas = document.getElementById('mouse-right-canvas');
    if (canvas) {
        mouseX = nx * canvas.width;
        mouseY = ny * canvas.height;
    }
});

function getCurrentPlaybackWindow() {
    const data = injectEnabled ? artifactData : cleanData;
    if (data.length === 0) return null;
    // Use most recent window
    const idx = (currentIndex - 1 + data.length) % data.length;
    return data[idx];
}

function updateMousePanels() {
    if (!mousePanelExpanded) return;

    const currentWin = getCurrentPlaybackWindow();
    const isArtifact = currentWin
        && currentWin.injected_type !== null
        && injectEnabled;

    // Right panel: always smooth
    const rightPos = { x: mouseX, y: mouseY };
    rightTrail.push({ ...rightPos, artifact: false, type: null });

    // Left panel: smooth + jitter when artifact active
    let leftPos = { x: mouseX, y: mouseY };
    if (isArtifact) {
        let jitter = 40;
        if (currentWin.injected_type === 'spike') jitter = 60;
        if (currentWin.injected_type === '60hz') jitter = 35;
        if (currentWin.injected_type === 'flatline') jitter = 20;
        leftPos.x += (Math.random() - 0.5) * jitter * 2;
        leftPos.y += (Math.random() - 0.5) * jitter * 2;
    }
    leftTrail.push({ ...leftPos, artifact: isArtifact, type: isArtifact ? currentWin.injected_type : null });

    // Trim trails
    if (leftTrail.length > MAX_TRAIL) leftTrail = leftTrail.slice(-MAX_TRAIL);
    if (rightTrail.length > MAX_TRAIL) rightTrail = rightTrail.slice(-MAX_TRAIL);

    drawMouseCanvas('mouse-left-canvas', leftTrail, leftPos, false);
    drawMouseCanvas('mouse-right-canvas', rightTrail, rightPos, true);
}

function drawMouseCanvas(canvasId, trail, currentPos, isClean) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, w, h);

    // Draw trail with fading
    for (let i = 1; i < trail.length; i++) {
        ctx.beginPath();
        ctx.moveTo(trail[i-1].x, trail[i-1].y);
        ctx.lineTo(trail[i].x, trail[i].y);

        if (trail[i].artifact) {
            switch (trail[i].type) {
                case 'spike':    ctx.strokeStyle = '#e74c3c'; break;
                case '60hz':     ctx.strokeStyle = '#e67e22'; break;
                case 'flatline': ctx.strokeStyle = '#f1c40f'; break;
                default:         ctx.strokeStyle = '#e74c3c'; break;
            }
        } else {
            ctx.strokeStyle = isClean ? '#2ecc71' : '#ecf0f1';
        }

        ctx.globalAlpha = 0.2 + 0.8 * (i / trail.length);
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Draw cursor dot
    const dotR = 6 * devicePixelRatio;
    const glowR = 12 * devicePixelRatio;
    ctx.beginPath();
    ctx.arc(currentPos.x, currentPos.y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = isClean ? '#2ecc71' : (
        trail.length > 0 && trail[trail.length-1].artifact ? '#e74c3c' : '#ecf0f1'
    );
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(currentPos.x, currentPos.y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = isClean ? 'rgba(46,204,113,0.15)' : 'rgba(236,240,241,0.1)';
    ctx.fill();
}


// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
    if (e.key === 'p') toggleMousePanel();
    if (e.key === 'i') {
        const toggle = document.getElementById('inject-toggle');
        toggle.checked = !toggle.checked;
        onInjectToggle();
    }
});


// ===== Window Resize =====
window.addEventListener('resize', () => {
    resizeCanvases();
});

loadData();
