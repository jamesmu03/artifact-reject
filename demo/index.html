<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Signal Monitor — Artifact Rejection Demo</title>
<meta name="description" content="Real-time artifact rejection for BCI neural signals. Compare MAD+FFT detector vs z-score baseline.">
<style>
:root {
    --bg-primary: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text-primary: #ecf0f1;
    --text-secondary: #7f8c8d;
    --green: #2ecc71;
    --red: #e74c3c;
    --orange: #e67e22;
    --blue: #3498db;
    --yellow: #f1c40f;
    --font-main: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ===== Status bar ===== */
#status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    padding: 0 16px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 5;
}

#status-bar .left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}

.title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-primary);
}

#status-bar .right {
    display: flex;
    align-items: center;
    gap: 14px;
}

.meta {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
}

.divider {
    color: var(--border);
    font-size: 12px;
}

/* Inline toggle switches */
.toggle-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    user-select: none;
}

.toggle-inline input { display: none; }

.toggle-track-sm {
    width: 32px;
    height: 16px;
    border-radius: 8px;
    background: var(--border);
    position: relative;
    transition: background 0.2s;
}

.toggle-track-sm::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
}

.toggle-inline input:checked + .toggle-track-sm {
    background: var(--green);
}

.toggle-inline input:checked + .toggle-track-sm::after {
    transform: translateX(16px);
}

/* ===== Traces ===== */
#traces {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 12px;
    padding-bottom: 48px; /* space for collapsed mouse bar */
    min-height: 0;
}

.trace-wrap {
    flex: 1;
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 0;
}

.trace-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.trace-label {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 11px;
    z-index: 1;
    pointer-events: none;
}

.trace-stats {
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    z-index: 1;
    pointer-events: none;
    color: var(--text-secondary);
}

/* ===== Mouse/Keyboard panel ===== */
#mouse-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-primary);
    border-top: 1px solid var(--border);
    z-index: 10;
    transition: height 0.4s ease;
    overflow: hidden;
}

#mouse-panel.collapsed {
    height: 40px;
}

#mouse-panel.collapsed #mouse-content {
    display: none;
}

#mouse-panel.expanded {
    height: calc(66vh - 30px);
}

#mouse-toggle-bar {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 13px;
    transition: background 0.2s;
    user-select: none;
}

#mouse-toggle-bar:hover {
    background: var(--bg-card);
}

.key-hint {
    font-size: 11px;
    color: var(--border);
    font-family: var(--font-mono);
}

#mouse-content {
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(100% - 40px);
    padding: 16px 24px;
}

/* ===== Keyboard demo ===== */
#keyboard-demo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 600px;
    padding: 8px 0;
}

#kb-header {
    display: flex;
    justify-content: center;
    width: 100%;
}

.kb-label {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 8px;
}

.mode-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
}

.mode-btn {
    padding: 6px 16px;
    font-size: 12px;
    font-family: var(--font-main);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}

.mode-btn:first-child { border-right: 1px solid var(--border); }

.mode-btn.active { color: #000; }
#mode-ours.active { background: var(--green); }
#mode-baseline.active { background: var(--red); }

/* Keyboard area: relative container for cursor overlay */
#kb-area {
    position: relative;
    cursor: none;
    padding: 16px;
    user-select: none;
}

/* Trail canvas overlaid on keyboard */
#trail-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
}

#kb-grid {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 1;
    pointer-events: none;
}

.kb-row {
    display: flex;
    gap: 6px;
    justify-content: center;
}

.kb-key {
    width: 44px;
    height: 44px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 500;
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: background 0.2s, border-color 0.2s;
}

.kb-key.hover { border-color: var(--text-secondary); background: #1c2333; }
.kb-key.flash-correct { background: rgba(46,204,113,0.3); border-color: var(--green); }
.kb-key.flash-wrong { background: rgba(231,76,60,0.3); border-color: var(--red); }
.kb-key-wide { width: 64px; }

/* BCI cursor dot — visibility controlled by JS mouseenter/leave */
#bci-cursor {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(46,204,113,0.4);
    pointer-events: none;
    z-index: 20;
    transform: translate(-50%, -50%);
    transition: background 0.2s, box-shadow 0.2s;
}

#bci-cursor.displaced {
    background: var(--red);
    box-shadow: 0 0 12px rgba(231,76,60,0.5);
}

/* Footer */
#kb-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

#kb-output {
    display: flex;
    align-items: center;
    gap: 4px;
}

#kb-typed {
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 3px;
}

#kb-typed .char-correct { color: var(--text-primary); }
#kb-typed .char-wrong { color: var(--red); }

.kb-cursor-blink {
    color: var(--text-primary);
    animation: blink 1s step-end infinite;
    font-family: var(--font-mono);
}

@keyframes blink { 50% { opacity: 0; } }

#kb-clear {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-main);
    margin-left: 12px;
}

#kb-status {
    font-size: 12px;
    min-height: 18px;
}

/* Pulsing red dot when artifact is active */
.artifact-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse-red 0.5s ease-in-out infinite alternate;
    vertical-align: middle;
    margin-right: 4px;
}

@keyframes pulse-red {
    from { opacity: 0.5; }
    to { opacity: 1; }
}
</style>
</head>
<body>

<!-- Status Bar -->
<div id="status-bar">
    <div class="left">
        <div class="pulse-dot"></div>
        <span class="title">Neural Signal Monitor</span>
    </div>
    <div class="right">
        <span class="meta">32 CH</span>
        <span class="divider">|</span>
        <span class="meta">30 kHz</span>
        <span class="divider">|</span>
        <label class="toggle-inline">
            <span>Inject</span>
            <input type="checkbox" id="inject-toggle">
            <span class="toggle-track-sm"></span>
        </label>
        <label class="toggle-inline">
            <span>Highlight</span>
            <input type="checkbox" id="highlight-toggle" checked>

    </div>
</div>

<!-- Three Signal Traces -->
<div id="traces">

<!-- Expandable Keyboard Panel -->
<div id="mouse-panel" class="collapsed">

            <div id="kb-header">
                <div id="kb-mode-toggle">

                    <div class="mode-switch">
                        <button id="mode-baseline" class="mode-btn active" onclick="setMode('baseline')">Baseline</button>

            </div>

            <!-- Keyboard with cursor overlay -->
            <div id="kb-area">
                <div id="kb-grid">
                    <div class="kb-row">
                        <div class="kb-key" data-char="Q">Q</div>
                        <div class="kb-key" data-char="W">W</div>
                        <div class="kb-key" data-char="E">E</div>
                        <div class="kb-key" data-char="R">R</div>
                        <div class="kb-key" data-char="T">T</div>
                        <div class="kb-key" data-char="Y">Y</div>
                        <div class="kb-key" data-char="U">U</div>
                        <div class="kb-key" data-char="I">I</div>
                        <div class="kb-key" data-char="O">O</div>
                        <div class="kb-key" data-char="P">P</div>
                    </div>
                    <div class="kb-row" style="padding-left: 22px;">
                        <div class="kb-key" data-char="A">A</div>
                        <div class="kb-key" data-char="S">S</div>
                        <div class="kb-key" data-char="D">D</div>
                        <div class="kb-key" data-char="F">F</div>
                        <div class="kb-key" data-char="G">G</div>
                        <div class="kb-key" data-char="H">H</div>
                        <div class="kb-key" data-char="J">J</div>
                        <div class="kb-key" data-char="K">K</div>

                    </div>
                    <div class="kb-row" style="padding-left: 44px;">
                        <div class="kb-key" data-char="Z">Z</div>

                </div>
                <div id="kb-status"></div>
            </div>
        </div>

</div>

<script>
// ===== Data & State =====
let cleanData = [];
let artifactData = [];
let currentIndex = 0;
let injectEnabled = false;
let highlightEnabled = true;

// Buffers
const DISPLAY_POINTS = 1200;
const MAX_AMPLITUDE = 800;
let signalBuffer = [];
let oursCleanBuffer = [];
let baselineCleanBuffer = [];
let artifactTypeBuffer = [];
let oursHitBuffer = [];
let baselineHitBuffer = [];

// Smooth scrolling
let tickIntervalMs = 400;
let tickTimer = null;
let pendingPoints = [];
let pendingOursFlags = [];
let pendingBaseFlags = [];
let pendingTypeFlags = [];

// Stats
let stats = {
    total: 0,
    oursTP: 0, oursFP: 0, oursFN: 0,
    baseTP: 0, baseFP: 0, baseFN: 0,
    oursDetected: 0,
    baseDetected: 0,
};

// Mouse panel
let mousePanelExpanded = false;

// Keyboard state
let kbMode = 'baseline';
let kbTyped = [];
let realMouseX = 0, realMouseY = 0;
let cursorX = 0, cursorY = 0;
let artifactOffset = { x: 0, y: 0 };
let trail = [];
const MAX_TRAIL = 200;

// Current window state (updated each tick for cursor logic)
let currentWinState = { injected_type: null, ours_hit: false, baseline_hit: false };


// ===== Data Loading =====
async function loadData() {
    try {
        const [cleanRes, artifactRes] = await Promise.all([
            fetch('data_clean.json'),
            fetch('data_artifacts.json'),
        ]);
        cleanData = await cleanRes.json();
        artifactData = await artifactRes.json();
        console.log(`Loaded ${cleanData.length} clean + ${artifactData.length} artifact windows`);
        startPlayback();
    } catch (err) {
        console.error('Failed to load data:', err);
    }
}


// ===== Canvas Sizing =====
function resizeCanvases() {
    const canvases = ['canvas-raw', 'canvas-ours', 'canvas-baseline'];
    canvases.forEach(id => {
        const c = document.getElementById(id);
        if (!c) return;
        const rect = c.parentElement.getBoundingClientRect();
        c.width = rect.width * devicePixelRatio;
        c.height = rect.height * devicePixelRatio;
    });
}


// ===== Stats =====
function updateStatsFromWindow(win) {
    stats.total++;
    const gt = win.injected_type !== null;
    if (gt) {
        if (win.ours_hit) stats.oursTP++; else stats.oursFN++;
        if (win.baseline_hit) stats.baseTP++; else stats.baseFN++;
    } else {
        if (win.ours_hit) stats.oursFP++;
        if (win.baseline_hit) stats.baseFP++;
    }
    if (win.ours_hit) stats.oursDetected++;
    if (win.baseline_hit) stats.baseDetected++;
}

function updateStats() {
    const oursPrec = (stats.oursTP + stats.oursFP > 0)
        ? ((stats.oursTP / (stats.oursTP + stats.oursFP)) * 100).toFixed(0) + '%' : '—';
    const oursRec = (stats.oursTP + stats.oursFN > 0)
        ? ((stats.oursTP / (stats.oursTP + stats.oursFN)) * 100).toFixed(0) + '%' : '—';
    document.getElementById('stats-ours').textContent = `P: ${oursPrec}  R: ${oursRec}`;

    const basePrec = (stats.baseTP + stats.baseFP > 0)
        ? ((stats.baseTP / (stats.baseTP + stats.baseFP)) * 100).toFixed(0) + '%' : '—';
    const baseRec = (stats.baseTP + stats.baseFN > 0)
        ? ((stats.baseTP / (stats.baseTP + stats.baseFN)) * 100).toFixed(0) + '%' : '—';
    document.getElementById('stats-baseline').textContent = `P: ${basePrec}  R: ${baseRec}`;
}


// ===== Artifact Highlighting (Fix 2: uniform red shading on ground truth) =====
function drawArtifactShading(ctx, w, h, typeBuffer) {
    if (!highlightEnabled) return;

    const n = typeBuffer.length;
    let inArtifact = false;
    let startX = 0;

    for (let i = 0; i < n; i++) {
        const x = (i / n) * w;
        const isArtifact = typeBuffer[i] !== null;

        if (isArtifact && !inArtifact) {
            inArtifact = true;
            startX = x;
        }
        if (!isArtifact && inArtifact) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.15)';
            ctx.fillRect(startX, 0, x - startX, h);
            inArtifact = false;
        }
    }
    if (inArtifact) {
        ctx.fillStyle = 'rgba(231, 76, 60, 0.15)';
        ctx.fillRect(startX, 0, w - startX, h);
    }
}


// ===== Trace Rendering (Fix 2: simplified — same shading on all traces) =====
function renderTrace(canvasId, signalBuf, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, w, h);

    if (signalBuf.length < 2) return;

    // Same ground-truth shading on every trace
    drawArtifactShading(ctx, w, h, artifactTypeBuffer);

    // Draw the signal line
    const yScale = h / (2 * MAX_AMPLITUDE);
    const yMid = h / 2;
    const n = signalBuf.length;

    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = devicePixelRatio;
    for (let i = 0; i < n; i++) {
        const x = (i / n) * w;
        const y = yMid - signalBuf[i] * yScale;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}


// ===== Playback =====
function tick() {
    const data = injectEnabled ? artifactData : cleanData;
    if (data.length === 0) return;
    const win = data[currentIndex % data.length];

    updateStatsFromWindow(win);

    // Track current window state for cursor logic
    currentWinState = {
        injected_type: win.injected_type,
        ours_hit: win.ours_hit,
        baseline_hit: win.baseline_hit,
    };
    updateKeyboardStatus();

    // Queue points for smooth draining
    const pts = win.signal_ch0;
    pendingPoints.push(...pts);
    pendingTypeFlags.push(...new Array(pts.length).fill(win.injected_type));
    pendingOursFlags.push(...new Array(pts.length).fill(win.ours_hit));
    pendingBaseFlags.push(...new Array(pts.length).fill(win.baseline_hit));

    updateStats();
    currentIndex++;
}

// Fix 4: Smooth scrolling with frame-based draining
function renderLoop(timestamp) {
    // Safety cap: if tab was backgrounded, don't let pending accumulate
    if (pendingPoints.length > DISPLAY_POINTS) {
        const excess = pendingPoints.length - 200;
        pendingPoints.splice(0, excess);
        pendingTypeFlags.splice(0, excess);
        pendingOursFlags.splice(0, excess);
        pendingBaseFlags.splice(0, excess);
    }

    // Drain pending points smoothly
    if (pendingPoints.length > 0) {
        const framesPerTick = tickIntervalMs / 16.67;
        const pointsPerFrame = Math.ceil(pendingPoints.length / framesPerTick);
        const batchSize = Math.max(1, Math.min(pointsPerFrame, pendingPoints.length));

        const ptsBatch = pendingPoints.splice(0, batchSize);
        const typesBatch = pendingTypeFlags.splice(0, batchSize);
        const oursBatch = pendingOursFlags.splice(0, batchSize);
        const baseBatch = pendingBaseFlags.splice(0, batchSize);

        signalBuffer.push(...ptsBatch);
        artifactTypeBuffer.push(...typesBatch);
        oursHitBuffer.push(...oursBatch);
        baselineHitBuffer.push(...baseBatch);

        // Build cleaned buffers
        oursCleanBuffer.push(...ptsBatch.map((v, i) => oursBatch[i] ? 0 : v));
        baselineCleanBuffer.push(...ptsBatch.map((v, i) => baseBatch[i] ? 0 : v));

        // Trim all to DISPLAY_POINTS
        const max = DISPLAY_POINTS;
        if (signalBuffer.length > max) {
            signalBuffer = signalBuffer.slice(-max);
            artifactTypeBuffer = artifactTypeBuffer.slice(-max);
            oursHitBuffer = oursHitBuffer.slice(-max);
            baselineHitBuffer = baselineHitBuffer.slice(-max);
            oursCleanBuffer = oursCleanBuffer.slice(-max);
            baselineCleanBuffer = baselineCleanBuffer.slice(-max);
        }
    }

    // Render all three traces
    renderTrace('canvas-raw', signalBuffer, '#ecf0f1');
    renderTrace('canvas-ours', oursCleanBuffer, '#2ecc71');
    renderTrace('canvas-baseline', baselineCleanBuffer, '#e67e22');

    // Keyboard panel (only when expanded)
    if (mousePanelExpanded) {
        updateBCICursor();
        renderTrailCanvas();
    }

    requestAnimationFrame(renderLoop);
}

function startPlayback() {
    resizeCanvases();
    tickTimer = setInterval(tick, tickIntervalMs);
    requestAnimationFrame(renderLoop);
}

function resetPlayback() {
    currentIndex = 0;
    signalBuffer = [];
    oursCleanBuffer = [];
    baselineCleanBuffer = [];
    artifactTypeBuffer = [];
    oursHitBuffer = [];
    baselineHitBuffer = [];
    pendingPoints = [];
    pendingOursFlags = [];
    pendingBaseFlags = [];
    pendingTypeFlags = [];
    trail = [];
    artifactOffset = { x: 0, y: 0 };
    stats = { total: 0, oursTP: 0, oursFP: 0, oursFN: 0, baseTP: 0, baseFP: 0, baseFN: 0, oursDetected: 0, baseDetected: 0 };
    updateStats();
}


// ===== Toggles =====
function onInjectToggle() {
    injectEnabled = document.getElementById('inject-toggle').checked;
    resetPlayback();
}

function onHighlightToggle() {
    highlightEnabled = document.getElementById('highlight-toggle').checked;
}

document.getElementById('inject-toggle').addEventListener('change', onInjectToggle);
document.getElementById('highlight-toggle').addEventListener('change', onHighlightToggle);


// ===== Mouse Panel (Fix 1: overlay, no layout changes) =====
function toggleMousePanel() {
    mousePanelExpanded = !mousePanelExpanded;
    const panel = document.getElementById('mouse-panel');
    const icon = document.getElementById('mouse-toggle-icon');
    const text = document.getElementById('mouse-toggle-text');

    if (mousePanelExpanded) {
        panel.classList.replace('collapsed', 'expanded');
        icon.textContent = '▼';
        text.textContent = 'Hide patient impact demo';
    } else {
        panel.classList.replace('expanded', 'collapsed');
        icon.textContent = '▲';
        text.textContent = 'Show patient impact demo';
    }
}


// ===== Keyboard BCI Cursor (Fix 3) =====
function isArtifactActive() {
    if (!injectEnabled) return false;
    return currentWinState.injected_type !== null;
}

function isDetectorFiring() {
    // Does the current mode's detector fire on this window?
    if (kbMode === 'ours') return currentWinState.ours_hit;
    if (kbMode === 'baseline') return currentWinState.baseline_hit;
    return false;
}

// Mouse tracking on keyboard area
const kbArea = document.getElementById('kb-area');

kbArea.addEventListener('mousemove', (e) => {
    const rect = kbArea.getBoundingClientRect();
    realMouseX = e.clientX - rect.left;
    realMouseY = e.clientY - rect.top;
});

kbArea.addEventListener('mouseleave', () => {
    document.getElementById('bci-cursor').style.display = 'none';
});

kbArea.addEventListener('mouseenter', () => {
    document.getElementById('bci-cursor').style.display = 'block';
});

function updateBCICursor() {
    const artifactActive = isArtifactActive();
    const detectorFiring = isDetectorFiring();
    const displaced = artifactActive && !detectorFiring;  // artifact present but missed
    const frozen = detectorFiring;  // window blanked → no decoder input → cursor holds

    if (displaced) {
        if (artifactOffset.x === 0 && artifactOffset.y === 0) {
            const magnitude = 40 + Math.random() * 40;
            const angle = Math.random() * Math.PI * 2;
            artifactOffset.x = Math.cos(angle) * magnitude;
            artifactOffset.y = Math.sin(angle) * magnitude;
        }
        artifactOffset.x += (Math.random() - 0.5) * 3;
        artifactOffset.y += (Math.random() - 0.5) * 3;
    } else {
        artifactOffset.x *= 0.85;
        artifactOffset.y *= 0.85;
        if (Math.abs(artifactOffset.x) < 1 && Math.abs(artifactOffset.y) < 1) {
            artifactOffset.x = 0;
            artifactOffset.y = 0;
        }
    }

    // When frozen (detector fired → window blanked), hold cursor at last position
    if (!frozen) {
        const targetX = realMouseX + artifactOffset.x;
        const targetY = realMouseY + artifactOffset.y;

        // Lerp toward target (0.7 = slightly dampened, feels like decoded BCI cursor)
        const sensitivity = 0.7;
        cursorX += (targetX - cursorX) * sensitivity;
        cursorY += (targetY - cursorY) * sensitivity;

        const area = document.getElementById('kb-area');
        cursorX = Math.max(0, Math.min(area.offsetWidth, cursorX));
        cursorY = Math.max(0, Math.min(area.offsetHeight, cursorY));
    }

    const dot = document.getElementById('bci-cursor');
    dot.style.left = cursorX + 'px';
    dot.style.top = cursorY + 'px';
    dot.classList.toggle('displaced', displaced);

    trail.push({ x: cursorX, y: cursorY, displaced });
    if (trail.length > MAX_TRAIL) trail = trail.slice(-MAX_TRAIL);

    updateKeyHover(cursorX, cursorY);
}

function updateKeyHover(cx, cy) {
    document.querySelectorAll('.kb-key.hover').forEach(k => k.classList.remove('hover'));
    const key = getKeyAtPosition(cx, cy);
    if (key) key.classList.add('hover');
}

function getKeyAtPosition(x, y) {
    const keys = document.querySelectorAll('.kb-key');
    const areaRect = document.getElementById('kb-area').getBoundingClientRect();

    for (const key of keys) {
        const rect = key.getBoundingClientRect();
        const kx = rect.left - areaRect.left;
        const ky = rect.top - areaRect.top;
        const kw = rect.width;
        const kh = rect.height;

        if (x >= kx && x <= kx + kw && y >= ky && y <= ky + kh) {
            return key;
        }
    }
    return null;
}

// Click registers key under BCI cursor, not real mouse
kbArea.addEventListener('click', (e) => {
    e.preventDefault();

    const key = getKeyAtPosition(cursorX, cursorY);
    if (!key) return;

    const char = key.dataset.char;

    if (char === 'BACK') {
        kbTyped.pop();
        renderTypedOutput();
        return;
    }

    // Determine intended key (under real mouse)
    const areaRect = kbArea.getBoundingClientRect();
    const realKey = getKeyAtPosition(
        e.clientX - areaRect.left,
        e.clientY - areaRect.top
    );
    const intendedChar = realKey ? realKey.dataset.char : null;
    const correct = char === intendedChar;

    kbTyped.push({ actual: char, correct });

    // Flash feedback
    const cls = correct ? 'flash-correct' : 'flash-wrong';
    key.classList.add(cls);
    setTimeout(() => key.classList.remove(cls), 300);

    renderTypedOutput();
});

// Trail rendering
function renderTrailCanvas() {
    const canvas = document.getElementById('trail-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const area = document.getElementById('kb-area');
    canvas.width = area.offsetWidth;
    canvas.height = area.offsetHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 1; i < trail.length; i++) {
        ctx.beginPath();
        ctx.moveTo(trail[i-1].x, trail[i-1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = trail[i].displaced ? '#e74c3c' : '#2ecc71';
        ctx.globalAlpha = 0.1 + 0.4 * (i / trail.length);
        ctx.lineWidth = 2;
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

// Mode toggle
function setMode(mode) {
    kbMode = mode;
    document.getElementById('mode-baseline').classList.toggle('active', mode === 'baseline');
    document.getElementById('mode-ours').classList.toggle('active', mode === 'ours');
    clearTyped();
    artifactOffset = { x: 0, y: 0 };
    trail = [];
}

function clearTyped() {
    kbTyped = [];
    renderTypedOutput();
}

function renderTypedOutput() {
    let html = '';
    for (const t of kbTyped) {
        const cls = t.correct ? 'char-correct' : 'char-wrong';
        html += `<span class="${cls}">${t.actual}</span>`;
    }
    document.getElementById('kb-typed').innerHTML = html;
}

// Keyboard status indicator
function updateKeyboardStatus() {
    if (!mousePanelExpanded) return;

    const el = document.getElementById('kb-status');
    const active = isArtifactActive();
    const firing = isDetectorFiring();

    if (!injectEnabled || !active) {
        el.innerHTML = '';
    } else if (firing) {
        el.innerHTML = '<span style="color:var(--green);">● Artifact caught — cursor stable</span>';
    } else {
        el.innerHTML = '<span class="artifact-dot"></span> <span style="color:var(--red);">Artifact active — cursor displaced</span>';
    }
}


// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
    if (e.key === 'p') toggleMousePanel();
    if (e.key === 'i') {
        const toggle = document.getElementById('inject-toggle');
        toggle.checked = !toggle.checked;
        onInjectToggle();
    }
});


// ===== Window Resize =====
window.addEventListener('resize', () => {
    resizeCanvases();
});


// ===== Init =====
loadData();
</script>
</body>
